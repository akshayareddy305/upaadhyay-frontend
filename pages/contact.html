<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Upaadhyay</title>
<meta name="description" content="Contact the Upaadhyay team with questions about faculty hiring, jobs or your account.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://upaadhyay.com/pages/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Upaadhyay">
<meta property="og:title" content="Contact Us | Upaadhyay">
<meta property="og:description" content="Contact the Upaadhyay team with questions about faculty hiring, jobs or your account.">
<meta property="og:url" content="https://upaadhyay.com/pages/contact.html">
<meta property="og:image" content="https://upaadhyay.com/assets/og-image.png">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/site-pages.css"></head>
<body class="sp"><div id="siteNav"></div>
<header class="sp-hero sm"><div class="wrap"><h1>Contact us</h1><p>Questions, feedback or need a hand? Send us a message.</p></div></header>
<div class="sp-sheet"><section class="sp-sec"><div class="wrap"><div class="sp-contact">
<div class="sp-form"><h3>Send us a message</h3>
<div id="cfBox">
<div class="sp-row"><div class="sp-field"><label for="cfName">Your name</label><input id="cfName" autocomplete="name"></div>
<div class="sp-field"><label for="cfEmail">Email</label><input id="cfEmail" type="email" autocomplete="email"></div></div>
<div class="sp-row"><div class="sp-field"><label for="cfRole">I am a</label><select id="cfRole"><option>Faculty / teacher</option><option>Institution / employer</option><option>Other</option></select></div>
<div class="sp-field"><label for="cfTopic">Topic</label><select id="cfTopic"><option>General question</option><option>Account or login</option><option>Posting a job</option><option>Profile verification</option><option>Report a problem</option></select></div></div>
<div class="sp-field"><label for="cfMsg">Message</label><textarea id="cfMsg"></textarea></div>
<button class="sp-btn org" type="button" onclick="sendContact()">Send message</button>
</div></div>
<aside>
<div class="sp-info"><div class="sp-ico">✉</div><div><h3>Email</h3><a id="cfMail" href="#"></a></div></div>
<div class="sp-info"><div class="sp-ico">?</div><div><h3>Help centre</h3><a href="help-centre.html">Browse answers to common questions</a></div></div>
<div class="sp-info"><div class="sp-ico">⏱</div><div><h3>Response time</h3><p>We aim to reply within 1–2 working days.</p></div></div>
</aside></div></div></section></div>
<div id="siteChrome"></div>
<script src="../js/api.js"></script>
<script src="../js/store.js"></script><script src="../js/employer.js"></script><script src="../js/auth.js"></script><script src="../js/faculty.js"></script><script src="../js/layout.js"></script><script src="../js/backend.js"></script><script src="../js/site-pages.js"></script>
<script>spBoot('contact');var SUPPORT_EMAIL='support@upaadhyay.com'; /* change to your real support address */
document.getElementById('cfMail').textContent=SUPPORT_EMAIL;document.getElementById('cfMail').href='mailto:'+SUPPORT_EMAIL;
function sendContact(){
 var n=cfName.value.trim(),e=cfEmail.value.trim(),m=cfMsg.value.trim();
 if(!n||!/^\S+@\S+\.\S+$/.test(e)||m.length<10){showGenericToast('Please enter your name, a valid email and a message.');return;}
 var body=m+'\n\n— '+n+' ('+e+')\nRole: '+cfRole.value;
 window.location.href='mailto:'+SUPPORT_EMAIL+'?subject='+encodeURIComponent('['+cfTopic.value+'] Upaadhyay enquiry')+'&body='+encodeURIComponent(body);
 showGenericToast('Opening your email app…');
}</script></body></html>
