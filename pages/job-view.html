<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — Upadyay</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/site-pages.css"></head>
<body class="sp"><div id="siteNav"></div>
<main id="main"></main><div id="siteChrome"></div>
<script src="../js/api.js"></script>
<script src="../js/store.js"></script><script src="../js/employer.js"></script><script src="../js/auth.js"></script><script src="../js/faculty.js"></script><script src="../js/layout.js"></script><script src="../js/site-pages.js"></script>
<script>spBoot('jobs');
var q=new URLSearchParams(location.search),m=document.getElementById('main'),cat=q.get('c')||(location.pathname.split('/jobs/')[1]||'').replace(/\/$/,''),id=q.get('id');
if(!id&&/^\d+$/.test(cat)){id=cat;cat=''}
function list(){var all=cat==='all'||!SP_CATS[cat],t=all?['All Jobs','Explore verified faculty opportunities from institutions across India.']:SP_CATS[cat];document.title=t[0]+' Jobs — Upadyay';
 m.innerHTML='<header class="sp-hero sm"><div class="wrap"><h1>'+t[0]+(all?'':' Jobs')+'</h1><p>'+(all?t[1]:'Explore verified '+t[0]+' opportunities from institutions across India. '+t[1])+'</p></div></header><section class="sp-sec"><div class="wrap"><div class="sp-filters"><input id="s" placeholder="Search title or institution" oninput="draw()"><select id="l" onchange="draw()"><option value="">Location</option>'+SP_CITY.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="x" onchange="draw()"><option value="">Experience</option><option value="3">3+ yrs</option><option value="6">6+ yrs</option></select><select id="u" onchange="draw()"><option value="">Subject</option>'+['Computer Science','Physics','Commerce','Chemistry','Mathematics','Biotechnology'].map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="i" onchange="draw()"><option value="">Institution</option>'+SP_INST.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><select id="y" onchange="draw()"><option value="">Job type</option><option>Full-time</option><option>Contract</option></select></div><p class="sp-sub" id="n"></p><div class="sp-jobs" id="g"></div></div></section>';draw()}
function draw(){var g=function(k){return document.getElementById(k).value},s=g('s').toLowerCase();var r=SP_JOBS.filter(function(j){return(cat==='all'||!SP_CATS[cat]||j.cat===cat)&&(!s||(j.title+j.inst).toLowerCase().indexOf(s)>-1)&&(!g('l')||j.loc===g('l'))&&(!g('x')||j.exp>=+g('x'))&&(!g('u')||j.subj===g('u'))&&(!g('i')||j.inst===g('i'))&&(!g('y')||j.type===g('y'))});document.getElementById('n').textContent=r.length+' jobs';document.getElementById('g').innerHTML=r.map(spJobCard).join('')||'<p>No jobs match these filters.</p>'}
function detail(){var j=SP_JOBS.filter(function(x){return x.id==id})[0];if(!j){cat='all';return list()}document.title=j.title+' — Upadyay';var li=function(a){return'<ul>'+a.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul>'};
 m.innerHTML='<header class="sp-hero sm"><div class="wrap"><h1>'+j.title+'</h1><p>'+j.inst+' · '+j.loc+' · '+j.type+'</p></div></header><section class="sp-sec"><div class="wrap sp-det"><div class="sp-card"><div class="sp-meta"><span>Qualification: '+j.qual+'</span><span>Experience: '+j.exp+'+ yrs</span><span>Salary: '+j.sal+'</span></div><h3>About the role</h3><p>'+j.inst+' is hiring a '+j.title+' to strengthen its '+j.subj+' department.</p><h3>Responsibilities</h3>'+li(['Deliver lectures and practicals','Mentor students and guide projects','Contribute to curriculum and research'])+'<h3>Requirements</h3>'+li([j.qual,j.exp+'+ years of relevant experience'])+'<h3>Preferred skills</h3>'+li(['Publications or research record','Modern teaching tools'])+'<h3>Benefits</h3>'+li(['Provident fund','Research support','Professional development'])+'<h3>About the institution</h3><p>'+j.inst+', '+j.loc+'.</p></div><aside class="sp-card sp-apply"><h3>'+j.title+'</h3><p style="margin-bottom:14px">'+j.sal+'</p><a class="sp-btn" href="'+PAGES.login+'">Apply Now</a><button class="sp-btn out" style="width:100%" onclick="showGenericToast(\'Job saved\')">Save Job</button><button class="sp-btn out" style="width:100%;margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);showGenericToast(\'Link copied\')">Share</button></aside></div></section>'}
id?detail():list();</script></body></html>
