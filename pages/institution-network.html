<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institution Network — Upadyay</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/institution.css?v=14">
<style>
.nw{max-width:min(100%,1680px);margin:0 auto;padding:16px clamp(16px,3.2vw,56px) 60px;box-sizing:border-box}
.nw>*{margin-left:auto;margin-right:auto}
.nw-stack h1,.nw-stack>p.sub{text-align:center}
.nw h1{font-size:20px;margin:0 0 4px}.nw h2{font-size:16px;margin:0 0 8px}.nw h3{font-size:15px;margin:0 0 8px}
.nw p.sub{color:var(--ink-faint);margin:0 0 20px;font-size:14px}
.nw-demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--blue-50);border:1px dashed var(--blue-500);border-radius:var(--radius);padding:8px 10px;margin-bottom:12px;font-size:12.5px}
.nw-demo b{margin-right:4px}.nw-demo .btn.on{background:var(--blue-700);color:#fff;border-color:var(--blue-700)}
.c{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:12px 14px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pick{cursor:pointer;border:2px solid var(--line);transition:.15s}.pick:hover{border-color:var(--blue-500)}.pick.sel{border-color:var(--blue-700);background:var(--blue-50)}
.lg{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.lg.big{width:48px;height:48px;font-size:17px}
.row{display:flex;gap:12px;align-items:center}.row.top{align-items:flex-start}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.bd{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:20px;display:inline-block}
.bd.m{background:#EFE7FB;color:#5B2AA8}.bd.s{background:#E3EEFF;color:#1B4FBF}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.st.y{background:#FFF4D6;color:#8A6100}.st.g{background:#DDF5E5;color:#17753A}.st.r{background:#FDE3E0;color:#B3261E}.st.n{background:#ECEFF4;color:#55627A}
.mut{color:var(--ink-faint);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.fld.err input{border-color:#B3261E}
.res{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}.res:hover{border-color:var(--blue-500);background:var(--blue-50)}
.sk{height:58px;border-radius:6px;background:linear-gradient(90deg,#eef1f6,#f7f8fb,#eef1f6);background-size:200% 100%;animation:sk 1s infinite}@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:12px 0}.tabs button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--blue-700);border-color:var(--blue-700)}
.pst{display:flex;gap:6px;overflow-x:auto;margin:12px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px}.pst button{background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;white-space:nowrap}.pst button.on{background:var(--blue-900);color:#fff;border-color:var(--blue-900)}.pst button.done{color:#17753A;border-color:#17753A}.pst button:disabled{opacity:.5;cursor:not-allowed}
.dtabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:2px;padding:4px;background:#fff;margin:0 0 16px;overflow-x:auto}.dtabs button{flex:1;min-width:max-content;padding:10px 16px;border:0;border-radius:2px;background:transparent;font:600 13.5px inherit;font-family:inherit;color:var(--ink-soft);text-align:center;cursor:pointer;white-space:nowrap}.dtabs button:hover{background:var(--blue-50)}.dtabs button.on{background:var(--blue-900);color:#fff;box-shadow:var(--shadow-sm)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-md);z-index:30;overflow:hidden;padding:4px 0}.sg{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;font-size:14px}.sg:hover{background:var(--blue-50)}.sg .lg{width:28px;height:28px;border-radius:50%}
.num{font-size:26px;font-weight:700;color:var(--blue-900)}
.mod{position:fixed;inset:0;background:rgba(10,20,50,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mod>.c{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.steps{display:flex;flex-direction:column;gap:10px}.steps div{display:flex;gap:10px;align-items:center}.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#ECEFF4;color:#55627A}.dot.d{background:#17753A;color:#fff}.dot.p{background:#F2B01E;color:#fff}
.chk{width:72px;height:72px;border-radius:50%;background:#17753A;color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pop .4s}@keyframes pop{from{transform:scale(.3)}}
.tree{padding-left:18px;border-left:2px solid var(--blue-100);margin-left:22px}
@media(max-width:640px){.mod{align-items:flex-end;padding:0}.mod>.c{border-radius:14px 14px 0 0}.btns .btn{flex:1}}

.nw-stack{max-width:880px;margin:0 auto}
.nw-big{padding:26px 28px;border-width:2px;border-color:var(--blue-700)}
.nw-big h3{font-size:20px;margin-bottom:12px}
.nw-sm{padding:12px 16px}
.nw-sm h3{font-size:14px;margin-bottom:6px}
.nw-mid{max-width:560px}
.nw-selc>.c{padding:14px 18px}
.nw-selc .lg.big{width:48px;height:48px}
.nw-form{max-width:720px}
.nw-steps{display:flex;gap:6px;margin:16px 0 0}
.nw-steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.nw-steps span.on{background:var(--blue-700)}
.nw-conn{padding:12px 16px}
.nw-conn .lg{width:40px;height:40px}
.nw-subrev{padding:12px 16px;font-size:14px}
.nw-subrev .lg.big{width:48px;height:48px}
.nw-lg a{color:var(--blue-700);text-decoration:underline;font-weight:600}
.nw-stack>.pick:first-child{padding:26px 28px}
.nw-or{display:flex;align-items:center;gap:14px;color:var(--ink-faint);margin:14px 0}
.nw-or:before,.nw-or:after{content:"";flex:1;height:1px;background:var(--line)}
.nw-small{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}
.nw-small .nw-ic svg{width:26px;height:26px;display:block}
.nw-small .grow{min-width:200px}
.nw-lg{margin:10px 0 0}
.nw.nw-wide{max-width:none;padding:0}
</style>
</head>
<body class="page">
<div id="siteNav"></div>
<main class="nw" id="app"></main>
<div id="siteChrome"></div>
<script src="../js/api.js"></script>
<script src="../js/store.js"></script>
<script src="../js/employer.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/faculty.js"></script>
<script src="../js/layout.js"></script>
<script>
mountNav(''); mountChrome({noFooter:true});
/* ---------- mock data (UI demo only, no backend) ---------- */
const COL=['#5B2AA8','#1B4FBF','#0E7C66','#B4531A','#A3245E','#3B5B92','#6B7A1F','#7A3E9D'];
const MAINS=[
 {n:'St. Joseph Educational Group',c:'Hyderabad, Telangana',t:'Education Group',code:'10245',d:'Schools, junior colleges and engineering campuses across South India.'},
 {n:'St. Joseph Education Trust',c:'Bengaluru, Karnataka',t:'Education Trust',code:'20871',d:'Charitable trust running 9 institutions.'},
 {n:'St. Jude Institutions',c:'Chennai, Tamil Nadu',t:'University Group',code:'31502',d:'Multi-campus university group.'},
 {n:'Sri Chaitanya Academic Society',c:'Vijayawada, Andhra Pradesh',t:'Education Society',code:'44019',d:'Junior colleges and coaching centres.'},
 {n:'Narayana Vidya Foundation',c:'Nellore, Andhra Pradesh',t:'Foundation',code:'55630',d:'K-12 and professional colleges.'},
 {n:'Osmania Heritage Trust',c:'Hyderabad, Telangana',t:'Education Trust',code:'67744',d:'Heritage degree colleges.'},
 {n:'St. Joseph Educational Society',c:'Warangal, Telangana',t:'Education Society',code:'81236',d:'Degree and pharmacy colleges in Warangal.'},
 {n:'St. Joseph Group of Institutions',c:'Bengaluru, Karnataka',t:'College Group',code:'82347',d:'Engineering and management campuses.'},
 {n:"St. Joseph's Academy Trust",c:'Chennai, Tamil Nadu',t:'Education Trust',code:'83458',d:'Schools and junior colleges.'},
 {n:'St. Joseph Vidya Samstha',c:'Vijayawada, Andhra Pradesh',t:'Education Society',code:'84569',d:'K-12 and degree colleges.'},
 {n:'Stanley Group of Colleges',c:'Hyderabad, Telangana',t:'College Group',code:'78123',d:'Engineering and pharmacy colleges.'}];
const SUB={n:'St. Joseph College of Engineering',c:'Hyderabad, Telangana',t:'Engineering College',by:'Dr. Kittu Kumar',em:'principal@sjce.edu',ph:'+91 98765 43210',d:'AICTE-approved engineering college offering B.Tech and M.Tech programmes.',date:'29 Sep 2026'};
let reqs=[{...SUB,id:1,s:'Pending'},{n:'St. Joseph Polytechnic',c:'Warangal, Telangana',t:'Polytechnic',by:'Ms. Anita Rao',em:'head@sjp.edu',ph:'+91 90000 11111',d:'Diploma programmes in engineering.',date:'27 Sep 2026',id:2,s:'Pending'}];
const BR=[{n:'St. Joseph Junior College',c:'Secunderabad, Telangana',j:11,f:42,a:76,l:'1 day ago'},{n:'St. Joseph Degree College',c:'Karimnagar, Telangana',j:8,f:31,a:54,l:'3 days ago'}];
const S={empty:false,bv:null,bt:'overview',v:'type',type:null,main:MAINS[0],q:'',role:'reg',tab:'overview',st:'pending',all:false,chk:false,code:''};
let LOGOS=(()=>{try{return JSON.parse(localStorage.getItem('nwLogos'))||{}}catch(e){return {}}})();
const crest=(n)=>{const c=COL[n.length%8];return `<svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" fill="${c}"/><path d="M24 6l14 4.5v11.5c0 9-6 15.5-14 20-8-4.5-14-11-14-20V10.5z" fill="#fff"/><path d="M24 17c-3.5-2.2-7-2.3-10.5-1v13c3.500-1.300 7-1.200 10.500 1 3.500-2.200 7-2.300 10.500-1V16c-3.500-1.300-7-1.200-10.500 1z" fill="${c}"/><path d="M24 17v13" stroke="#fff" stroke-width="1.6"/><circle cx="24" cy="12" r="1.8" fill="${c}"/></svg>`};
const lg=(n,cls='')=>`<div class="lg ${cls}" style="background:#fff;border:1px solid var(--line);overflow:hidden;padding:0">${LOGOS[n]?`<img src="${LOGOS[n]}" alt="" style="width:100%;height:100%;object-fit:cover">`:crest(n)}</div>`;
const B=(m)=>m?'<span class="bd m">MAIN INSTITUTION</span>':'<span class="bd s">SUB-BRANCH</span>';
const ST={pending:['y','<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#C99A00"/></svg> Pending Main Institution Approval'],approved:['g','<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Connected'],rejected:['r','<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#B3261E"/></svg> Request Rejected'],withdrawn:['n','<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#8A93A6"/></svg> Request Withdrawn']};
const stB=k=>`<span class="st ${ST[k][0]}">${ST[k][1]}</span>`;
const mainCard=(m,extra='')=>`<div class="c row wrap">${lg(m.n,'big')}<div class="grow"><b>${m.n}</b> ${B(1)}<div class="mut">${m.c} · ${m.t}</div>${extra}</div></div>`;
const go=(v)=>{S.v=v;render();scrollTo(0,0)};
const FROM_LOGIN=new URLSearchParams(location.search).get('from')==='login';
function contType(){
  if(S.type=='main'){ FROM_LOGIN?goTo('employer'):goTo('register',{role:'company',type:'main'}); return; }
  let d=null;try{d=JSON.parse(localStorage.getItem('nwSub'))}catch(e){}
  if(FROM_LOGIN&&d&&d.st=='approved'){Object.assign(SUB,d.sub);S.main=MAINS.find(m=>m.code==d.mainCode)||S.main;S.st='approved';reqs[0]={...reqs[0],...SUB,id:1,s:'Approved'};S.role='sub';S.sd='profile';render();return;}
  location.href='subbranch-auth.html?mode=register';
}
const set=(k,v)=>{S[k]=v;render()};
/* ---------- render ---------- */
function demoBar(){return `<div class="nw-demo"><b>Demo view:</b>
${[['reg','Registration flow'],['sub','Sub-branch dashboard'],['main','Main branch dashboard']].map(([r,l])=>`<button class="btn btn-light btn-sm ${S.role==r?'on':''}" onclick="S.role='${r}';S.tab='overview';S.bv=null;if(r=='reg')S.v='type';render()">${l}</button>`).join('')}
${S.role=='sub'?'<span class="mut">Status:</span>'+Object.keys(ST).map(k=>`<button class="btn btn-light btn-sm ${S.st==k?'on':''}" onclick="set('st','${k}')">${k}</button>`).join(''):''}${S.role=='main'?`<button class="btn btn-light btn-sm ${S.empty?'on':''}" onclick="set('empty',!S.empty)">Empty state</button>`:''}</div>`}
function render(){
  const V={type:vType,sublogin:vSubLogin,code:vFind,confirm:vConfirm,form:vForm,review:vReview,done:vDone}[S.v];
  document.getElementById('app').className='nw'+(S.role=='sub'?' nw-wide':'');document.getElementById('app').innerHTML=(S.role=='reg'?V():S.role=='sub'?vSub():vMain());
}
/* 1. choose type */
function vType(){const o2=(k,ic,t,bd,d,ex,btn)=>`<div class="c pick nw-small ${S.type==k?'sel':''}" onclick="location.href='subbranch-auth.html?mode=register'"><div class="nw-ic">${ic}</div><div class="grow"><h3 style="display:inline;margin:0 8px 0 0">${t}</h3>${bd}<p class="mut" style="margin:4px 0 0">${d}</p></div><span class="btn btn-ghost btn-sm">${btn}</span></div>`;
const o=(k,ic,t,bd,d,ex,btn)=>`<div class="c pick ${S.type==k?'sel':''}" onclick="set('type','${k}')"><div style="font-size:30px">${ic}</div><h2>${t}</h2>${bd}<p class="mut">${d}</p>${ex?`<p class="mut">e.g. ${ex}</p>`:''}<span class="btn ${S.type==k?'btn-primary':'btn-ghost'} btn-sm">${btn}</span></div>`;
return `<div class="nw-stack"><h1>What type of institution are you registering?</h1><p class="sub">Choose one to continue. Nothing is created until you pick.</p>${o('main','<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;color:var(--blue-700);vertical-align:0" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>','Main / Normal Institution','<span class="bd m">MAIN / NORMAL INSTITUTION</span>','Create a new independent institution profile or the primary/main organization profile.','University, College, School, Company, Education Group, Main Campus, Headquarters','Create Institution')}<div class="nw-or">or</div>${o2('sub','<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;color:var(--blue-700);vertical-align:0" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>','Sub-Branch / College','<span class="bd s">SUB-BRANCH</span>','Join an existing registered Main Institution as a branch, college, campus or affiliated institution.','','Register as Sub-Branch')}<p class="mut nw-lg">Already a sub-branch? <a href="#" onclick="location.href='subbranch-auth.html?mode=login';return false">Log in</a></p>
<p class="btns row wrap"><button class="btn btn-light" onclick="goTo('home')">Back</button><button class="btn btn-primary" ${S.type?'':'disabled style="opacity:.5"'} onclick="contType()">Continue</button></p>${S.type=='main'?'<p class="mut">Continues to the existing institution form. After registering you become a <span class="bd m">MAIN INSTITUTION</span> and receive a 5-digit institution code for your branches.</p>':''}</div>`}
/* sub-branch login (separate from main-institution login) */
function vSubLogin(){return `<h1>Sub-branch login</h1><p class="sub">Sign in to your sub-branch dashboard. Main institutions log in from the main Log in page.</p><div class="c g" style="max-width:480px"><label class="fld">Branch email or code<input id="sl_id"></label><label class="fld">Password<input id="sl_pw" type="password"></label>${S.slerr?`<div style="color:#B3261E;font-size:13px">${S.slerr}</div>`:''}<p class="btns row wrap"><button class="btn btn-light" onclick="S.slerr='';go('type')">Back</button><button class="btn btn-primary" onclick="subLogin()">Log in</button></p><p class="mut">No account yet? <a href="#" onclick="S.type='sub';S.slerr='';go('code');return false">Register as sub-branch</a></p></div>`}
function subLogin(){const i=document.getElementById('sl_id').value.trim(),p=document.getElementById('sl_pw').value;let d=null;try{d=JSON.parse(localStorage.getItem('nwSub'))}catch(e){}
 if(!i||!p){S.slerr='Enter your branch email or code and password.';render();return}
 if(!d||d.st!='approved'){S.slerr='No approved sub-branch found on this device. Register as a sub-branch first.';render();return}
 Object.assign(SUB,d.sub);S.main=MAINS.find(m=>m.code==d.mainCode)||S.main;S.st='approved';reqs[0]={...reqs[0],...SUB,id:1,s:'Approved'};
 setBranchSession(i,SUB.n);if(typeof updateNavForLogin==='function')updateNavForLogin();
 S.slerr='';S.role='sub';S.sd='profile';render();scrollTo(0,0)}
/* 2. find main institution */
function vFind(){
  const digits=S.code.replace(/\D/g,''),bad=S.code&&!/^\d{5}$/.test(S.code);
  const q=S.q.trim().toLowerCase(),hits=q?MAINS.filter(m=>(m.n+m.c).toLowerCase().includes(q)):[];
  const shown=S.all?hits:hits.slice(0,6);
  return `<div class="nw-stack"><h1>Find Your Main Institution</h1><p class="sub">Your Sub-Branch must be connected to an existing Main Institution.</p>
<div class="c nw-big"><h3>Main Institution Code</h3>
<label class="fld ${bad?'err':''}">Main Institution Code<input id="code" maxlength="5" inputmode="numeric" placeholder="Enter 5-digit code, e.g. 10245" value="${S.code}" oninput="S.code=this.value;const b=document.getElementById('cb');b.disabled=!/^\\d{5}$/.test(this.value);this.parentNode.classList.toggle('err',this.value&&b.disabled)"></label>
<p class="mut" id="ce">${bad?'Code must be exactly 5 digits.':'Demo codes: 10245, 20871, 31502'}</p>
<button id="cb" class="btn btn-primary" ${/^\d{5}$/.test(S.code)?'':'disabled'} onclick="const m=MAINS.find(x=>x.code==S.code);m?(S.main=m,go('confirm')):(S.code='',S.q='zzz',render())">Find Institution</button></div>
<div class="nw-or">or</div>
<div class="c nw-sm"><h3>Search by Institution Name</h3>
<label class="fld">Institution name<input id="q" placeholder="Search institution name..." value="${S.q}" oninput="liveQ(this.value)" autofocus></label>
<div id="hits" class="g" style="margin-top:12px">${hitsHtml(q,shown,hits.length)}</div></div></div>`}
function hitsHtml(q,shown,total){
  if(!q)return '<div class="mut">Choose your main institution — start typing to search. Only Main / Normal institutions are listed; Sub-Branches can\'t be selected as a parent.</div>';
  if(!shown.length)return `<h3>No Main Institution Found</h3><div class="mut">We couldn't find a matching Main Institution.</div><p class="btns row wrap"><button class="btn btn-light btn-sm" onclick="S.q='';S.code='';render()">Search Again</button><button class="btn btn-ghost btn-sm" onclick="goTo('register',{role:'company',type:'main'})">Create a Main / Normal Institution</button></p>`;
  return shown.map(m=>`<div class="res" onclick="S.main=MAINS[${MAINS.indexOf(m)}];go('confirm')">${lg(m.n)}<div class="grow"><b>${m.n}</b> ${B(1)}<div class="mut">${m.t}</div><div class="mut"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg> ${m.c}</div><div class="mut">Code: <b>${m.code}</b></div></div></div>`).join('')+(total>shown.length?`<button class="btn btn-light btn-sm" onclick="set('all',true)">View all results (${total})</button>`:'');
}
let tm;function liveQ(v){S.q=v;S.all=false;const h=document.getElementById('hits');h.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';clearTimeout(tm);tm=setTimeout(()=>{const q=v.trim().toLowerCase(),hits=q?MAINS.filter(m=>(m.n+m.c).toLowerCase().includes(q)):[];h.innerHTML=hitsHtml(q,hits.slice(0,6),hits.length)},350)}
/* 3. confirm */
function vConfirm(){return `<div class="nw-stack nw-mid"><h1>Selected Main Institution</h1><p class="sub">This sub-branch will be connected to the institution below.</p>
<div class="nw-sm nw-selc">${mainCard(S.main,`<div><b>Institution Code: ${S.main.code}</b></div>`)}</div>
<p class="btns row wrap"><button class="btn btn-primary" onclick="S.fs=0;go('form')">Continue</button><button class="btn btn-light" onclick="go('code')">Change Institution</button></p></div>`}
/* connection card */

function vBranch(){const b=brs()[S.bv],T=['overview','jobs','faculty','applications','activity'];
 const body={overview:()=>`<div class="c"><h3>Institution Overview</h3><p class="mut">${SUB.d}<br>${b.c} · Departments: CSE, ME, ECE, Civil · Affiliation: JNTUH</p><p><b>Jobs ${b.j}</b> · <b>Faculty ${b.f}</b> · <b>Applications ${b.a}</b></p></div>`,
 jobs:()=>`<div class="g g2">${mainJobsHtml(b.n)}${['Assistant Professor - CSE','Lecturer - Physics'].map(t=>`<div class="c"><b>${t}</b><div class="mut">${b.n} · Applications: 18</div><span class="st g">Active</span></div>`).join('')}</div>`,
 faculty:()=>`<div class="g g3">${['Dr. Ravi Teja','Ms. Sunita Rao'].map(n=>`<div class="c row top">${lg(n)}<div><b>${n}</b><div class="mut">Asst. Professor</div><span class="st g">Verified</span></div></div>`).join('')}</div>`,
 applications:()=>`<div class="c"><b>${b.a} applications</b><div class="mut">Latest: Assistant Professor - CSE (18), Lecturer - Physics (11)</div></div>`,
 activity:()=>`<div class="c">Posted a new faculty position · 2 hours ago<br><span class="mut">Updated branch profile · 3 days ago</span></div>`}[S.bt]();
 return `<button class="btn btn-light btn-sm" onclick="S.bv=null;render()">← Back to Connected Branches</button><div class="c row wrap" style="margin-top:12px">${lg(b.n,'big')}<div class="grow"><h1 style="margin:0">${b.n}</h1>${B(0)} <b>Part of ${S.main.n}</b><div class="mut">${b.c}</div></div><span class="st g"><svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Connected</span></div><div class="tabs">${T.map(t=>`<button class="${S.bt==t?'on':''}" onclick="set('bt','${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${body}`}
function vMain(){
  if(S.bv!==null&&brs()[S.bv])return vBranch();
  const list=S.empty?[]:reqs,pend=list.filter(r=>r.s=='Pending').length,conn=S.empty?0:10+brs().length;
  const body={overview:()=>`${codeCard()}<h2 style="margin-top:20px">Institution Network</h2><div class="g g3">${[['Connected Branches',conn],['Pending Requests',S.empty?0:pend+2],['Total Faculty','850'],['Active Jobs','126'],['Applications','2,430']].map(([l,n])=>`<div class="c"><div class="num">${n}</div><div class="mut">${l}</div></div>`).join('')}</div><h2 style="margin-top:20px">Branch Hierarchy</h2>${tree()}`,
  branches:()=>`<h2>Connected Institutions</h2>${brs().length?`<div class="g g2">${brs().map((b,i)=>`<div class="c"><div class="row wrap">${lg(b.n)}<div class="grow"><b>${b.n}</b> ${B(0)}<div class="mut"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg> ${b.c}</div></div><span class="st g"><svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Connected</span></div><p class="mut">Jobs: <b>${b.j}</b> · Faculty: <b>${b.f}</b> · Applications: <b>${b.a}</b> · Last activity ${b.l}</p><button class="btn btn-light btn-sm" onclick="S.bv=${i};S.bt='overview';render()">View Institution</button></div>`).join('')}</div>`:empty('No connected branches yet','Share your 5-digit code 10245 so branches can request to join.')}`,
  requests:()=>`<h2>Sub-Branch Requests</h2>${list.length?`<div class="g">${list.map(r=>`<div class="c"><div class="row wrap">${lg(r.n)}<div class="grow"><b>${r.n}</b> <span class="bd s">SUB-BRANCH REQUEST</span><div class="mut"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg> ${r.c} · ${r.t} · Submitted ${r.date}</div><div class="mut">${r.by} · ${r.em}</div><div>${r.d}</div></div><span class="st ${r.s=='Pending'?'y':r.s=='Approved'?'g':'r'}">${r.s=='Pending'?'<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#C99A00"/></svg> Pending Review':r.s=='Approved'?'<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Connected':'<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#B3261E"/></svg> Request Rejected'}</span></div>
  <p class="btns row wrap" style="margin:12px 0 0"><button class="btn btn-light btn-sm" onclick="detail(${r.id})">View Profile</button>${r.s=='Pending'?`<button class="btn btn-primary btn-sm" onclick="dlg('a',${r.id})">Approve</button><button class="btn btn-ghost btn-sm" onclick="dlg('r',${r.id})">Reject</button>`:''}</p></div>`).join('')}</div>`:empty('No pending requests','New Sub-Branch requests will appear here.')}`,
  jobs:()=>`<h2>Jobs across branches</h2><div class="row wrap" style="margin-bottom:14px"><select class="fld" style="padding:8px;border:1px solid var(--line);border-radius:4px" onchange="S.jf=this.value;render()"><option value="all">All Branches</option>${[SUB.n,...BR.map(b=>b.n)].map(n=>`<option ${S.jf==n?'selected':''}>${n}</option>`).join('')}</select></div><div class="g g2">${mainJobsHtml(S.jf=='all'?'':S.jf)}${[['Assistant Professor - Computer Science',BR[0].n,18],['Lecturer - Mathematics',BR[1].n,9],['Associate Professor - ECE',SUB.n,12]].map(([t,b,a])=>`<div class="c"><b>${t}</b><div class="mut">Posted by:</div><div><b>${b}</b> ${B(0)}</div><div class="mut"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg> Hyderabad, Telangana · Applications: ${a}</div><span class="st g">Active</span></div>`).join('')}</div>`,
  faculty:()=>`<h2>Faculty Across Institutions</h2>${filters(['Branch','Department','Subject','Experience'])}<div class="g g3">${[['Dr. Ravi Teja','Professor','Physics',BR[0].n,'12 yrs','Verified'],['Ms. Sunita Rao','Asst. Professor','Computer Science',BR[1].n,'6 yrs','Verified'],['Mr. Imran Khan','Lecturer','Mathematics',BR[0].n,'3 yrs','Pending']].map(([n,d,s,b,e,v])=>`<div class="c row top">${lg(n)}<div><b>${n}</b><div class="mut">${d} · ${s}</div><div class="mut">${b} · ${e}</div><span class="st ${v=='Verified'?'g':'y'}">${v}</span></div></div>`).join('')}</div>`,
  activity:()=>`<h2>Branch Activity</h2><div class="g">${[['Posted a new faculty position','Assistant Professor - Computer Science','2 hours ago',BR[0].n],['Faculty profile created','Dr. Ravi Teja','5 hours ago',BR[1].n],['Faculty application received','Lecturer - Mathematics','Yesterday',BR[1].n],['New document uploaded','Affiliation certificate','2 days ago',SUB.n]].map(([a,b,t,n])=>`<div class="c row">${lg(n)}<div class="grow"><b>${n}</b><div>${a}</div><div class="mut">${b}</div></div><span class="mut">${t}</span></div>`).join('')}</div>`}[S.tab]();
  return `<div class="c row wrap">${lg(S.main.n,'big')}<div class="grow"><h1 style="margin:0">${S.main.n}</h1>${B(1)} <span class="st g"><svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Active</span><div class="mut">${S.main.c} · Code <b>10245</b></div><b>${conn} Connected Institutions</b></div><div class="btns row wrap"><button class="btn btn-light btn-sm" onclick="S.role='sub';S.sd='profile';render()">← My Branch Dashboard</button><button class="btn btn-primary btn-sm" onclick="set('tab','branches')">View Branches</button></div></div>
  <div class="dtabs">${TABS.map(([t,l])=>`<button class="${S.tab==t?'on':''}" onclick="set('tab','${t}')">${l}${t=='requests'&&pend?' ('+pend+')':''}</button>`).join('')}</div>${body}
  <div class="mut" style="margin-top:18px">Menu: Dashboard · Institution Profile · Branches · Branch Requests · Faculty · Jobs · Applications · Activity · Verification · Settings</div>`}
const filters=a=>`<div class="row wrap" style="margin-bottom:14px">${a.map(x=>`<select class="fld" style="padding:8px;border:1px solid var(--line);border-radius:4px"><option>${x}</option></select>`).join('')}</div>`;
/* request detail + modals (mock only) */
let modal='';
const mod=h=>{document.getElementById('siteChrome').insertAdjacentHTML('beforeend',`<div class="mod" id="mod" onclick="if(event.target==this)closeMod()"><div class="c">${h}</div></div>`)};
const closeMod=()=>{const m=document.getElementById('mod');m&&m.remove()};
function detail(id){const r=reqs.find(x=>x.id==id);mod(`<div class="row wrap">${lg(r.n,'big')}<div><h2 style="margin:0">${r.n}</h2>${B(0)}</div></div><p class="mut">Connected Main Institution: <b>${S.main.n}</b></p>
<h3>Institution Overview</h3><p class="mut">${r.t} · ${r.c}<br>${r.em} · ${r.ph}<br>${r.d}</p><h3>Contact</h3><p class="mut">${r.em} · ${r.ph} · www.sjce.edu</p><h3>Academic Details</h3><p class="mut">Courses: B.Tech, M.Tech · Departments: CSE, ME, ECE, Civil · Affiliation: JNTUH · Accreditation: NAAC A · Facilities: Labs, Library, Hostel</p>
<h3>Documents</h3><div class="row wrap">${['Affiliation Certificate','AICTE Approval','Registration Proof'].map(d=>`<div class="c" style="padding:8px 12px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg> ${d}</div>`).join('')}</div>
<h3 style="margin-top:12px">Request Details</h3><p class="mut">Date: ${r.date} · Status: ${r.s} · Submitted by ${r.by} · Main Institution selected: ${S.main.n}</p>
<p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Close</button>${r.s=='Pending'?`<button class="btn btn-primary" onclick="closeMod();dlg('a',${id})">Approve &amp; Connect</button><button class="btn btn-ghost" onclick="closeMod();dlg('r',${id})">Reject Request</button>`:''}</p>`)}
function dlg(k,id){const r=reqs.find(x=>x.id==id);
 if(k=='a')mod(`<h2>Approve Sub-Branch?</h2><p>You are about to connect this institution to your Main Institution.</p><div class="c"><b>${S.main.n}</b> ${B(1)}<div class="mut">↓</div><b>${r.n}</b> ${B(0)}</div><p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Cancel</button><button class="btn btn-primary" onclick="fin(${id},'Approved')">Approve &amp; Connect</button></p>`);
 else mod(`<h2>Reject Sub-Branch Request</h2><label class="fld">Reason for rejection<textarea rows="4" placeholder="Please provide a reason for rejecting this request."></textarea></label><p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Cancel</button><button class="btn btn-primary" onclick="fin(${id},'Rejected')">Reject Request</button></p>`)}
function fin(id,s){reqs.find(x=>x.id==id).s=s;closeMod();if(id==1)S.st=s=='Approved'?'approved':'rejected';render();mod(`<div style="text-align:center"><div class="chk" style="${s=='Rejected'?'background:#B3261E':''}">${s=='Approved'?'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;vertical-align:0" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;vertical-align:0" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</div><h2>${s=='Approved'?'<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:0;margin-right:2px" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#17753A"/></svg> Sub-Branch Approved':'Request Rejected'}</h2><button class="btn btn-primary" onclick="closeMod();set('tab','${s=='Approved'?'branches':'requests'}')">${s=='Approved'?'View Connected Institutions':'Back to Requests'}</button></div>`)}
(()=>{const _st=new URLSearchParams(location.search).get('start');if(FROM_LOGIN||_st==='type'||_st==='code')return;try{const d=JSON.parse(localStorage.getItem('nwSub'));if(d&&d.st=='approved'){Object.assign(SUB,d.sub);S.main=MAINS.find(m=>m.code==d.mainCode)||S.main;S.st='approved';reqs[0]={...reqs[0],...SUB,id:1,s:'Approved'};S.role='sub';S.sd='profile'}}catch(e){}})();
(()=>{const q=new URLSearchParams(location.search).get('start');if((q==='code'||(!q&&typeof isLoggedIn!=='undefined'&&isLoggedIn&&currentRole==='branch'))&&S.role==='reg'){S.type='sub';S.v='code'}})();
(()=>{const t=new URLSearchParams(location.search).get('tab');if(S.role==='sub'&&['profile','post','jobs','cands','reqs'].includes(t)&&(t==='profile'||S.st==='approved'))S.sd=t})();
const nwOpenTab=t=>{if(S.role!=='sub')return false;if(S.st!=='approved'&&t!=='profile'){lockedTab();return true}S.sd=t;render();scrollTo(0,0);return true};
render();
</script>
</body>
</html>
