<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin log in — Upaadhyay</title>
<link rel="icon" href="../assets/logo/favicon-32.png">
<!-- Same stylesheets and card layout as the faculty login (pages/login.html) -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/trendz-auth.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/auth-split.css">
<style>
.auth-page{grid-template-columns:1fr !important;background:#f3f1f7 !important;overflow-y:auto}
.auth-page .auth-card{display:block !important;margin:20px auto !important;border-radius:5px !important;box-shadow:0 10px 40px rgba(75,31,158,.12) !important;padding:26px !important;max-width:380px !important}
.auth-card h2{font-size:24px !important;margin-bottom:4px !important;letter-spacing:-.5px}
.auth-card .sub{font-size:14px !important}
.auth-card .ap-page-tag{font-size:11px;padding:3px 10px;margin-bottom:8px !important}
.auth-card form{margin-top:14px !important}
.auth-card .modal-field label{font-size:13.5px !important;margin-bottom:5px}
.auth-card .modal-field input{padding:10px 12px !important;font-size:14px !important}
.auth-card button[type="submit"]{width:100%;padding:11px !important;font-size:14.5px !important;margin-top:6px}
.ac-brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
#authError{display:none;font-size:12.5px;color:#B3261E;margin:0 0 10px}
.ac-note{margin:14px 0 0;text-align:center;font-size:12.5px;color:#8A93A3}
</style>
</head>
<body class="page page-auth">
  <header class="as-head"><a class="as-brand" href="../index.html"><img src="../assets/logo/logo-mark.png" alt="Upaadhyay"><span class="as-word">Upaadh<span>yay</span></span></a></header>
  <div class="auth-page">
    <div class="auth-card" id="authCard">
      <div class="ac-brand"><img src="../assets/logo/logo-mark.png" alt="" style="height:26px;width:auto">Upaadhyay</div>
      <span class="ap-page-tag">Admin account</span>
      <h2>Welcome back</h2>
      <p class="sub">Log in to the admin console</p>

      <form id="adminLoginForm" novalidate>
        <div class="modal-field">
          <label for="alEmail">Admin email</label>
          <input type="email" id="alEmail" placeholder="admin@example.com" autocomplete="username" required>
        </div>
        <div class="modal-field ap-pw-field">
          <label for="alPass">Password</label>
          <div class="ap-pw-wrap">
            <input type="password" id="alPass" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="ap-pw-eye" id="alEye" aria-label="Show password">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </div>
        <p id="authError" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="alBtn">Log in</button>
      </form>
      <p class="ac-note">Administrator access only. Faculty and institutions <a href="../pages/login.html" style="color:var(--blue-700);font-weight:600">log in here</a>.</p>
    </div>
  </div>

<script src="../js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async function(){
  // Already signed in as admin → straight to the dashboard.
  if(await adminCurrent()){ window.location.replace('index.html'); return; }

  const form = document.getElementById('adminLoginForm'), btn = document.getElementById('alBtn'), err = document.getElementById('authError');
  const email = document.getElementById('alEmail'), pass = document.getElementById('alPass');
  function showErr(m){ err.textContent = m; err.style.display = 'block'; }

  document.getElementById('alEye').addEventListener('click', function(){
    const show = pass.type === 'password'; pass.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault(); err.style.display = 'none';
    if(!email.value.trim() || !pass.value){ showErr('Enter your admin email and password.'); return; }
    btn.disabled = true; btn.textContent = 'Logging in…';
    const r = await adminLogin(email.value, pass.value);
    if(r.ok){ window.location.replace('index.html'); return; }
    showErr(r.message); btn.disabled = false; btn.textContent = 'Log in'; pass.value = ''; pass.focus();
  });
  email.focus();
})();
</script>
</body>
</html>
