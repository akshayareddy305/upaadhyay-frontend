<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Upaadhyay</title>
<link rel="icon" href="../assets/logo/favicon-32.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side" id="adminSide"></aside>
    <div class="admin-main">
      <header class="admin-top" id="adminTop"></header>
      <main class="admin-body">

        <!-- Overview -->
        <section id="panelOverview" hidden>
          <div class="admin-stats" id="ovStats"></div>
          <div class="admin-two-col">
            <div class="admin-panel">
              <div class="admin-panel-head"><span>Institutions waiting for review</span><button type="button" class="btn btn-ghost btn-sm" onclick="adminGo('institutions','pending')">View all</button></div>
              <div class="admin-scroll"><table class="admin-table"><tbody id="ovPending"><tr><td class="admin-loading">Loading…</td></tr></tbody></table></div>
            </div>
            <div class="admin-panel">
              <div class="admin-panel-head"><span>Latest job applications</span><button type="button" class="btn btn-ghost btn-sm" onclick="adminGo('applications')">View all</button></div>
              <div class="admin-scroll"><table class="admin-table"><tbody id="ovApps"><tr><td class="admin-loading">Loading…</td></tr></tbody></table></div>
            </div>
          </div>
        </section>

        <!-- Institutions (verification queue) -->
        <section id="panelInstitutions" hidden>
          <div class="admin-panel">
            <div class="admin-tabs" id="instTabs" role="tablist"></div>
            <div class="admin-search-row">
              <input type="search" id="instSearch" placeholder="Search by institution name, email or city" aria-label="Search institutions">
              <span class="muted" id="instCount"></span>
            </div>
            <div class="admin-scroll"><table class="admin-table" id="instTable">
              <thead><tr><th>Institution</th><th>Type</th><th>Contact</th><th>Location</th><th>Registered</th><th>Profile</th><th class="num">Jobs</th><th>Status</th><th class="act"></th></tr></thead>
              <tbody id="instBody"></tbody>
            </table></div>
            <div id="instPager"></div>
          </div>
        </section>

        <!-- Job applications -->
        <section id="panelApplications" hidden>
          <div class="admin-panel">
            <div class="admin-search-row">
              <input type="search" id="appSearch" placeholder="Search by applicant name or email" aria-label="Search applications">
              <select id="appStatus" aria-label="Filter by status">
                <option value="">All statuses</option><option value="applied">Applied</option><option value="under_review">Under review</option>
                <option value="shortlisted">Shortlisted</option><option value="interview">Interview</option><option value="selected">Selected</option>
                <option value="rejected">Rejected</option><option value="withdrawn">Withdrawn</option>
              </select>
              <span class="muted" id="appCount"></span>
            </div>
            <div class="admin-scroll"><table class="admin-table">
              <thead><tr><th>Applicant</th><th>Job</th><th>Institution</th><th>Applied</th><th>Status</th><th class="act">Resume</th></tr></thead>
              <tbody id="appBody"></tbody>
            </table></div>
            <div id="appPager"></div>
          </div>
        </section>

        <!-- Faculty (candidate accounts) -->
        <section id="panelFaculty" hidden>
          <div class="admin-panel">
            <div class="admin-search-row">
              <input type="search" id="facSearch" placeholder="Search by name or email" aria-label="Search faculty">
              <select id="facStatus" aria-label="Filter by account status">
                <option value="">All accounts</option><option value="active">Active</option><option value="blocked">Blocked</option>
              </select>
              <span class="muted" id="facCount"></span>
            </div>
            <div class="admin-scroll"><table class="admin-table">
              <thead><tr><th>Faculty</th><th>Contact</th><th>Current role</th><th>Location</th><th class="num">Experience</th><th>Account</th><th class="act"></th></tr></thead>
              <tbody id="facBody"></tbody>
            </table></div>
            <div id="facPager"></div>
          </div>
        </section>

      </main>
      <footer class="admin-footer">© <span id="adminFooterYear"></span> Upaadhyay — Admin console</footer>
    </div>
  </div>

<script src="../js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
